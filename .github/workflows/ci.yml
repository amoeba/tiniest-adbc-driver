name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build driver
        run: |
          make build

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-driver-${{ matrix.os }}
          path: |
            tiny.dll
            libtiny.so
            libtiny.dylib
          if-no-files-found: ignore

      - name: Test driver
        run: |
          uv run pytest tests
